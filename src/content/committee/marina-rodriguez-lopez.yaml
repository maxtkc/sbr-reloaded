bio: Hi! I’m Marina, a third-year PhD student in Behavioural Neuroscience and Psychology. As one of your Vice-Presidents, I’m keen to help build a supportive, active, and welcoming community, organise events, and represent your ideas and concerns. Outside the SBR and my PhD, I do a lot of teaching and supervisions, was the 2025 SJC May Ball VP, co-organise the OrchardOCD public lecture series on obsessive-compulsive related disorders, and dance (occasionally). You’ll usually find me in the café trying to get work done while chatting to whoever is nearby. Always happy to hear from you, so please don’t hesitate to say hi!
