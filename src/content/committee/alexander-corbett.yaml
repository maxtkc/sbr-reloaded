bio: Alexander is allegedly social enough to have been one of the many social secretaries and to organise the internal (and Oxford) swaps which generated a lot of invoices. He is a viva era PhD student in Biotechnology and will talk you to death about artificial DNA if you're not careful. He is also a big fan of spreadsheets, being friendly, arriving 5min early to everything, and is intolerant of unread emails which is probably why it was suggested he do this job. Alexander likes Cambridge but will tell anyone that he thinks it would be better with a metre and a half of snow every winter and some hills which is how you know he's from the northern half of North America. Please say hi and he'll happily try to be helpful.
