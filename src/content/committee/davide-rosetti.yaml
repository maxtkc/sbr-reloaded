bio: Hi! My name is Davide, and I am a second-year PhD student in Cancer Biology. As the SBR Environment Officer at St John's College, I work closely with the college to promote and implement green policies, aiming to reduce environmental impact and integrate sustainable practices into college operations and activities. This includes organizing events that encourage St John's students to upcycle, reuse, and explore new ways to minimize our environmental footprint.
