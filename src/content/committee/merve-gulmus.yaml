bio: As a third-year PhD student in Physics, I understand the challenges of postgraduate life. That’s why I’m committed to organising social events that offer a chance to unwind, connect, and recharge. From creative workshops to themed parties, my goal is to foster a supportive community, enhance wellbeing, and bring moments of joy and balance to the postgraduate experience.
