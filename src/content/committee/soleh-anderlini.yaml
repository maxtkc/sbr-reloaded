bio:
  "Hello! I’m currently a fourth-year PhD student in Chemistry where I work on plastic and CO2 recycling and upcycling using microbes. In my second year as President, I've enjoyed continuing to represent postgraduate interests in college and advocating for increased transparency around investments, cost increases, and other changes. Introducing events such as the sBrOILER ROOMs and other cross-college opportunities has been great fun and we will continue this in the coming year!


  Please feel free to contact me about anything mentioned above as well as with any other concerns you would like to raise with college or ideas you have for the SBR!"
