  - Please select all foxes, not all cats.
giveUp: Give up
siren:
  - Wrong! Robot detected, alerting the porters!
sirenDetails:
  - The Porters' Lodge (01223 338671) has been notified. Please remain where you are.
  - A porter in a bowler hat is on the way. Please keep off the grass.
  - Your CRSid has been forwarded to the Dean.
letThrough:
  - On second thought, the porters are at BA Table. Letting you through.
  - The porters have decided you seem harmless. Continue.
  - Robots are permitted on the Backs on Tuesdays. Continue.
