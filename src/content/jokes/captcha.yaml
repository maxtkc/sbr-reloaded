title: captcha
brand: porterCAPTCHA
checkbox: I'm not a robot
hints:
  - Cats do not count.
  - Cambridge urban variety only.
  - If there are none left, click verify.
  - Foxes seen near the bins on Bridge Street count double.
verifying:
  - Verifying...
  - Consulting the Head Porter...
  - Checking your gown length...
failures:
  - Please try again.
  - That was a cat.
  - All of the foxes you selected were cats. Please try again.
