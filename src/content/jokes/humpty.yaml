fall:
  - Humpty Dumpty had a great fall.
  - Humpty Dumpty has left the wall. Permanently.
men:
  - Hold still. We finished a chapel that took 69 years to build.
  - This would be much easier if he were a King's man.
  - Have you tried Pritt Stick? It works on supervision reports.
  - The Provost will need to approve this in writing.
  - Our choir could sing him back together. They're on the radio at Christmas.
  - Henry VI founded us in 1441. He didn't finish things either.
  - We'll punt him back to King's and sort it out there.
  - In fairness, we have never fixed anything from St John's.
  - Lady Margaret Beaufort founded St John's. She's not here to help either.
  - I'm a historian. I can tell you exactly how he broke.
horses:
  - Neigh.
  - The horse has stood on a bit.
  - The horse is eating the yolk.
  - The horse would like it noted that it has hooves.
  - The horse is not insured for omelettes.
  - "Neigh. (Translation: keep off the grass.)"
finale: All the King's horses and all the King's men couldn't put Humpty together again.
facts:
  - King's College was founded by Henry VI in 1441, seventy years before St John's.
  - King's College Chapel took from 1446 to 1515 to build.
  - St John's was founded in 1511 by Lady Margaret Beaufort, grandmother of Henry VIII.
  - The Samuel Butler Room Society was founded in 1960, and the SBR is in I2 First Court.
porter:
  - The Porters will deal with it.
  - A Porter has been called. Please keep off the yolk.
