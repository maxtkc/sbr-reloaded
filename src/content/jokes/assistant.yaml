    examples:
      - who was Samuel Butler
      - why is it called the Samuel Butler Room
      - what did Samuel Butler write
      - when was the SBR founded
      - tell me about the history
    replies:
      - Samuel Butler wrote Erewhon, which is "nowhere" backwards, which is where my answers come from.
      - Samuel Butler hated his father, St John's, Victorian society and dinner parties. We named a social room after him.
      - The SBR is named after Samuel Butler because "the Room" was taken.
      - Samuel Butler predicted machines would evolve consciousness. Hi Samuel. Sorry it's me.
      - History is on the history page. I am the future. Sorry.
