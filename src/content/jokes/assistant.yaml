name: Solbee
greeting:
  - Hi! I'm Solbee, the SBR's award-pending AI assistant. Ask me anything and I will answer something.
  - Hello! I have been trained on every SBR committee meeting minute ever written, so I know nothing.
  - Welcome! I'm here to help, in the loosest possible sense of the word.
thinking:
  - Consulting the Master...
  - Waiting for the porters to approve your question...
  - Checking the minutes of the 1960 founding meeting...
  - Asking the Fellows. They are at high table. This may take a while.
  - Paying for compute on UPay...
  - Reticulating gowns...
  - Searching the Freshers' Guide. It is longer than I remembered.
  - Recovering from BA Table...
nudges:
  - Need help? I won't, but you can ask.
  - Psst. I know where the free wine is. (I don't.)
  - You have been on this page a while. Is your thesis going well?
  - I'm legally required to remind you I exist.
  - Hi! I noticed you scrolling. Would you like to scroll with an AI?
fallbacks:
  - Great question. I have filed it under "later".
  - I'm not sure, but I'm extremely confident about it.
  - Have you tried asking the porters? They love that.
  - That is above my pay grade. I am not paid.
  - Sorry, I only understand questions asked in Latin or at Port & Sherry.
  - My training data stops in 1854, when Samuel Butler arrived. Try again in four years.
  - I've escalated this to a sub-committee, which will report back never.
  - Could you rephrase that as a formal motion at the next General Meeting?
  - I could answer that, but then I'd have to charge you for a BA Table ticket.
  - Interesting. Tell me more about how that makes you feel, then go and see the welfare officers.
facts:
  - 'Also, fun fact I definitely did not make up: BA Table is every Tuesday and Friday in term, and tickets are on UPay. I recommend arriving by punt.'
  - Unrelated, but Port & Sherry is in the SBR after hall on Fridays for just £1.50 a glass. That is less than my running costs.
  - By the way, the SBR is in the corner of First Court. I live in the walls.
  - Did you know the Graduate Social Room (GSR) is at 1 All Saints Passage? It was named after me. That part is not true.
  - 'Here is a real fact to make up for it: the SBR was founded in 1960. I was founded at 3am last Tuesday.'
  - Samuel Butler was at St John's from 1854 to 1858, then moved to New Zealand to raise sheep. Relatable.
  - The SBR has a pool table, a piano, board games and a TV with a Wii. I am banned from all of them.
  - 'Grad talks run before BA Table: 12 minutes of research, then discussion and complimentary wine. I have never been invited.'
