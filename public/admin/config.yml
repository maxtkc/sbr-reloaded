# Sveltia CMS config. Collections mirror the zod schemas in src/content.config.ts.
backend:
  name: github
  repo: maxtkc/sbr-reloaded
  branch: main
  # OAuth Worker URL (see docs/cms-setup.md).
  base_url: https://sveltia-cms-auth.maxtkc.workers.dev
  commit_messages:
    create: 'cms: create {{collection}} "{{slug}}"'
    update: 'cms: update {{collection}} "{{slug}}"'
    delete: 'cms: delete {{collection}} "{{slug}}"'
    uploadMedia: 'cms: upload "{{path}}"'
    deleteMedia: 'cms: delete "{{path}}"'

site_url: https://sjcsbr.com/
display_url: https://sjcsbr.com/

# Images inserted into markdown bodies. Served from public/, so the base path is included.
media_folder: public/uploads
public_folder: /uploads

# Empty optional fields would fail the zod schemas (e.g. category: ''), so drop them.
output:
  omit_empty_optional_fields: true

slug:
  encoding: ascii
  clean_accents: true
  maxlength: 60

collections:
  - name: events
    label: Events
    label_singular: Event
    folder: src/content/events
    extension: md
    format: yaml-frontmatter
    create: true
    slug: '{{title}}'
    identifier_field: title
    summary: '{{title}} ({{start}})'
    sortable_fields: [start, title, category]
    media_folder: /src/assets/events
    public_folder: ../../assets/events
    fields:
      - { name: title, label: Title, widget: string }
      - name: start
        label: Start
        widget: datetime
        type: datetime-local
        format: 'YYYY-MM-DDTHH:mm'
        hint: 'Local UK time. For all-day events the time is ignored.'
      - name: end
        label: End
        widget: datetime
        type: datetime-local
        format: 'YYYY-MM-DDTHH:mm'
        hint: 'For all-day events, the last day of the event (time is ignored).'
      - { name: allDay, label: All day, widget: boolean, default: false, required: false }
      - name: rrule
        label: Repeat rule
        widget: string
        required: false
        hint: 'Optional RFC 5545 RRULE, e.g. FREQ=WEEKLY;BYDAY=TU,FR;UNTIL=20261204T235959Z'
      - { name: location, label: Location, widget: string }
      - name: category
        label: Category
        widget: select
        options:
          - { label: Academic, value: academic }
          - { label: Ents, value: ents }
          - { label: Formal Halls, value: formal }
          - { label: "Freshers' Fortnight", value: freshers }
          - { label: Sans Frontieres, value: sans-frontieres }
          - { label: Welfare, value: welfare }
      - name: ticketUrl
        label: Ticket link
        widget: string
        required: false
        pattern: ['^https?://', 'Must be a full URL starting with https://']
      - name: price
        label: Price (GBP)
        widget: number
        value_type: float
        min: 0
        step: 0.01
        required: false
        hint: 'Leave empty if unknown. Enter 0 for free events.'
      - { name: tbc, label: Date to be confirmed, widget: boolean, default: false, required: false }
      - { name: image, label: Flier or photo, widget: image, required: false }
      - name: imageAlt
        label: Image description
        widget: string
        required: false
        hint: 'Short description for screen readers. Defaults to "<title> flier".'
      - { name: body, label: Description, widget: markdown }

  - name: committee
    label: Committee
    label_singular: Committee member
    folder: src/content/committee
    extension: yaml
    format: yaml
    create: true
    slug: '{{name}}'
    identifier_field: name
    summary: '{{order}}. {{name}} - {{role}}'
    sortable_fields: [order, name]
    # Absolute media_folder so the CMS finds the files; public_folder keeps the paths Astro's image() expects.
    media_folder: /src/assets/committee
    public_folder: ../../assets/committee
    fields:
      - { name: name, label: Name, widget: string }
      - { name: role, label: Role, widget: string }
      - {
          name: email,
          label: Email,
          widget: string,
          pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', 'Must be an email address'],
        }
      - {
          name: order,
          label: Order,
          widget: number,
          value_type: int,
          hint: 'Position in the committee grid (1 = first).',
        }
      - {
          name: photo,
          label: Photo,
          widget: image,
          required: false,
          hint: 'Portrait, ideally under 2 MB. Members without a photo get the Samuel Butler portrait.',
        }
      - {
          name: inGames,
          label: Appears in games,
          widget: boolean,
          default: false,
          required: false,
          hint: 'Needs a photo and face crops in src/assets/faces (made by scripts/faces/faces.py); members without crops are skipped.',
        }
      - { name: bio, label: Bio, widget: text, required: false }

  - name: sections
    label: Page text
    label_singular: Text block
    folder: src/content/sections
    extension: md
    format: yaml-frontmatter
    # Blocks are wired to fixed places on the site, so only existing ones are edited.
    create: false
    delete: false
    identifier_field: title
    summary: '{{page}}: {{title}}'
    sortable_fields: [page, order, title]
    view_groups:
      - { label: Page, field: page }
    fields:
      - { name: title, label: Title, widget: string }
      - name: page
        label: Page
        widget: select
        options: [home, events, facilities, committee, quicklinks, history, footer]
      - { name: order, label: Order, widget: number, value_type: int }
      - name: category
        label: Event category
        widget: select
        required: false
        options: [academic, ents, formal, freshers, sans-frontieres, welfare]
      - { name: author, label: Author, widget: string, required: false }
      - { name: body, label: Text, widget: markdown }

  - name: quicklinks
    label: Quick links
    label_singular: Quick link
    folder: src/content/quicklinks
    extension: yaml
    format: yaml
    create: true
    slug: '{{label}}'
    identifier_field: label
    summary: '{{group}}: {{label}}'
    sortable_fields: [order, group, label]
    view_groups:
      - { label: Group, field: group }
    fields:
      - { name: label, label: Label, widget: string }
      - {
          name: url,
          label: URL,
          widget: string,
          pattern: ['^(https?://|mailto:|/)', 'Must be a full URL, mailto: or a site path'],
        }
      - name: group
        label: Group
        widget: select
        options:
          - Quick Links
          - Requests
          - Information Packs
          - College Services
          - Forms
          - Moodle
          - Accommodation
      - { name: order, label: Order, widget: number, value_type: int }
      - {
          name: featured,
          label: Show on landing page,
          widget: boolean,
          default: false,
          required: false,
        }

  - name: gallery
    label: Gallery
    label_singular: Photo
    folder: src/content/gallery
    extension: yaml
    format: yaml
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{alt}}'
    identifier_field: alt
    summary: '{{alt}}'
    sortable_fields: [order, date]
    media_folder: /src/assets/gallery
    public_folder: ../../assets/gallery
    fields:
      - { name: image, label: Image, widget: image }
      - {
          name: alt,
          label: Description (alt text),
          widget: string,
          hint: 'What is in the photo, for screen readers.',
        }
      - { name: caption, label: Caption, widget: string, required: false }
      - {
          name: date,
          label: Date,
          widget: datetime,
          time_format: false,
          format: YYYY-MM-DD,
          required: false,
        }
      - { name: order, label: Order, widget: number, value_type: int, default: 0, required: false }

  - name: instagram
    label: Instagram posts
    label_singular: Instagram post
    folder: src/content/instagram
    extension: yaml
    format: yaml
    create: true
    slug: '{{year}}{{month}}{{day}}-{{uuid_short}}'
    identifier_field: url
    summary: '{{url}}'
    sortable_fields: [order]
    fields:
      - name: url
        label: Post URL
        widget: string
        hint: 'e.g. https://www.instagram.com/p/ABC123xyz/ (no ?query part)'
        pattern:
          [
            '^https://www\.instagram\.com/(p|reel)/[\w-]+/?$',
            'Use https://www.instagram.com/p/<id>/ or /reel/<id>/',
          ]
      - { name: caption, label: Caption, widget: string, required: false }
      - { name: order, label: Order, widget: number, value_type: int, default: 0, required: false }

  # Copy for the gags; each file is read by key, so entries are fixed.
  - name: jokes
    label: Gag text
    label_singular: Gag text
    description: Joke lines used by the site's gags (assistant, captcha, pong, ragdoll).
    files:
      - name: assistant
        label: AI assistant (Solbee)
        file: src/content/jokes/assistant.yaml
        format: yaml
        fields:
          - { name: name, label: Name, widget: string }
          - {
              name: greeting,
              label: Greetings,
              widget: list,
              min: 1,
              field: { name: line, label: Line, widget: string },
            }
          - {
              name: thinking,
              label: Thinking messages,
              widget: list,
              min: 1,
              field: { name: line, label: Line, widget: string },
            }
          - {
              name: nudges,
              label: Nudges,
              widget: list,
              min: 1,
              field: { name: line, label: Line, widget: string },
            }
          - {
              name: fallbacks,
              label: Fallback replies,
              widget: list,
              min: 1,
              field: { name: line, label: Line, widget: string },
            }
          - {
              name: facts,
              label: Facts,
              widget: list,
              min: 1,
              field: { name: line, label: Line, widget: string },
            }
          - name: intents
            label: Intents
            widget: list
            min: 1
            summary: '{{fields.id}}'
            fields:
              - { name: id, label: ID, widget: string }
              - {
                  name: keywords,
                  label: Keywords,
                  widget: list,
                  min: 1,
                  field: { name: keyword, label: Keyword, widget: string },
                }
              - {
                  name: examples,
                  label: Example questions,
                  widget: list,
                  min: 1,
                  field: { name: line, label: Line, widget: string },
                }
              - {
                  name: replies,
                  label: Replies,
                  widget: list,
                  min: 1,
                  field: { name: line, label: Line, widget: string },
                }
      - name: captcha
        label: Captcha
        file: src/content/jokes/captcha.yaml
        format: yaml
        fields:
          - { name: brand, label: Brand, widget: string }
          - { name: checkbox, label: Checkbox label, widget: string }
          - {
              name: hints,
              label: Hints,
              widget: list,
              min: 1,
              field: { name: line, label: Line, widget: string },
            }
          - {
              name: verifying,
              label: Verifying messages,
              widget: list,
              min: 1,
              field: { name: line, label: Line, widget: string },
            }
          - {
              name: failures,
              label: Failure messages,
              widget: list,
              min: 1,
              field: { name: line, label: Line, widget: string },
            }
          - { name: giveUp, label: Give up button, widget: string }
          - {
              name: siren,
              label: Siren headlines,
              widget: list,
              min: 1,
              field: { name: line, label: Line, widget: string },
            }
          - {
              name: sirenDetails,
              label: Siren details,
              widget: list,
              min: 1,
              field: { name: line, label: Line, widget: string },
            }
          - {
              name: letThrough,
              label: Let-through messages,
              widget: list,
              min: 1,
              field: { name: line, label: Line, widget: string },
            }
      - name: pong
        label: Pong
        file: src/content/jokes/pong.yaml
        format: yaml
        fields:
          - { name: you, label: Player label, widget: string }
          - {
              name: taunts,
              label: Taunts,
              widget: list,
              min: 1,
              field: { name: line, label: Line, widget: string },
            }
          - {
              name: excuses,
              label: Excuses,
              widget: list,
              min: 1,
              field: { name: line, label: Line, widget: string },
            }
          - {
              name: smashes,
              label: Smash messages,
              widget: list,
              min: 1,
              field: { name: line, label: Line, widget: string },
            }
      - name: ragdoll
        label: Ragdoll
        file: src/content/jokes/ragdoll.yaml
        format: yaml
        fields:
          - {
              name: arrivals,
              label: Arrival lines,
              widget: list,
              min: 1,
              field: { name: line, label: Line, widget: string },
            }
          - {
              name: grabbed,
              label: Grabbed lines,
              widget: list,
              min: 1,
              field: { name: line, label: Line, widget: string },
            }
          - {
              name: flung,
              label: Flung lines,
              widget: list,
              min: 1,
              field: { name: line, label: Line, widget: string },
            }
